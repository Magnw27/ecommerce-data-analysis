name: Validate NVIDIA data pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch NVDA data
        run: python -m src.fetch_nvda --period 3mo --interval 1d

      - name: Build features
        run: python -m src.analyze

      - name: Validate generated dataset
        run: python -c "import pandas as pd; df=pd.read_csv('data/nvda_processed.csv'); assert len(df)>20 and {'close','return_pct','sma_20','volatility_20'}.issubset(df.columns); print(f'{len(df)} observations validated')"
